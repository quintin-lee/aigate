apiVersion: v1
kind: Secret
metadata:
  name: aigate-secrets
  namespace: aigate
  labels:
    app.kubernetes.io/name: aigate
    app.kubernetes.io/part-of: aigate
type: Opaque
stringData:
  # Replace with production PostgreSQL DSN
  AIGATE_PG_DSN: "postgresql://aigate:change-me-in-production@postgres.aigate.svc.cluster.local:5432/aigate?sslmode=disable"
  # Replace with high-entropy admin plane token
  AIGATE_ADMIN_TOKEN: "change-me-to-a-secure-random-admin-token"
  # Replace with 64-hex AES-256 master encryption key
  AIGATE_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  # Optional shared Redis instance / cluster for distributed rate limiting & circuit breakers
  AIGATE_REDIS_URL: "redis://redis.aigate.svc.cluster.local:6379"
