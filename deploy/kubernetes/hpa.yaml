apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aigate-hpa
  namespace: aigate
  labels:
    app.kubernetes.io/name: aigate
    app.kubernetes.io/part-of: aigate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aigate
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
