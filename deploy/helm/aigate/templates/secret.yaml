{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aigate.secretName" . }}
  labels:
    {{- include "aigate.labels" . | nindent 4 }}
type: Opaque
stringData:
  AIGATE_PG_DSN: {{ .Values.secrets.pgDsn | quote }}
  AIGATE_ADMIN_TOKEN: {{ .Values.secrets.adminToken | quote }}
  {{- if .Values.secrets.masterKey }}
  AIGATE_MASTER_KEY: {{ .Values.secrets.masterKey | quote }}
  {{- end }}
  {{- if .Values.secrets.redisUrl }}
  AIGATE_REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  {{- end }}
{{- end }}
